name: Minecraft Canary CI Harness

on:
  push:
    branches:
      - minecraft-plugin-update-canary-ci

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify source bundle
        run: |
          cat .canary-ci/source.part* | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          echo "bcef91dbf2153275b694c86551a34aab972d0cea7dd5adcca8bf2315e96c5dac  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          rm -rf _ci_project
          mkdir -p _ci_project
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C _ci_project
          test -f _ci_project/pom.xml

      - name: Maven verification
        working-directory: _ci_project
        run: mvn -B -ntp clean verify

      - name: Verify Docker daemon
        run: docker version

      - name: Prepare clean Paper 1.21.11 test server
        working-directory: _ci_project
        env:
          PAPERMC_USER_AGENT: minecraft-plugin-update-canary/0.1 (https://github.com/${{ github.repository }})
          PAPER_VERSION: '1.21.11'
        run: |
          scripts/prepare-paper-test-server.sh "$RUNNER_TEMP/canary-paper"
          echo "CANARY_TEST_SERVER=$RUNNER_TEMP/canary-paper" >> "$GITHUB_ENV"
          echo "CANARY_TEST_SERVER_JAR=server.jar" >> "$GITHUB_ENV"

      - name: Run Docker canonical fixtures and build Marketplace ZIP
        working-directory: _ci_project
        run: scripts/package-release.sh

      - name: Upload Marketplace ZIP
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-plugin-update-canary-v0.1
          path: _ci_project/release/minecraft-plugin-update-canary-v0.1.zip
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: _ci_project/**/target/surefire-reports/**
          if-no-files-found: ignore
